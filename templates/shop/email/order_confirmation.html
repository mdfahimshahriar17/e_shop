<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px;">

    <div style="max-width: 600px; margin: auto; background: white; padding: 30px;">

        <h2 style="color: #ff4d4d;">Order Confirmed!</h2>

        <p>Hi {{ order.first_name }},</p>

        <p>
            Thank you for your purchase. Your order has been successfully confirmed.
        </p>

        <hr>

        <h3>Order Details</h3>

        <p>
            <strong>Order ID:</strong> #{{ order.id }}
        </p>

        <p>
            <strong>Total:</strong> ${{ order.get_total_cost }}
        </p>

        <p>
            <strong>Status:</strong> {{ order.status|title }}
        </p>

        <hr>

        <h3>Thank you for shopping with Shopie!</h3>

        <p>
            We hope to see you again soon.
        </p>

    </div>

</body>
</html>
